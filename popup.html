<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    h2 {
      margin-top: 0;
    }

    .tip-box {
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #614700;
      line-height: 1.6;
    }

    .tip-box .tip-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .tip-box ol {
      margin: 0;
      padding-left: 18px;
    }

    .tip-box ol li {
      margin-bottom: 2px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    button:hover {
      background: #40a9ff;
    }

    button:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }

    #cancelBtn {
      background: #ff4d4f;
      display: none;
    }

    #cancelBtn:hover {
      background: #ff7875;
    }

    #preview {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 4px;
      min-height: 50px;
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }

    #preview.working {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      color: #003a8c;
    }

    #preview.success {
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      color: #135200;
    }

    #preview.error {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #a8071a;
    }
  </style>
</head>
<body>
  <h2>飞书铁磁</h2>

  <div class="tip-box">
    <div class="tip-title">⚠️ 开始前请确认</div>
    <ol>
      <li>请先<strong>从头到尾滚动一遍文档</strong>，确保所有内容已加载</li>
      <li>点击开始后，插件会自动<strong>滚回顶部</strong>再开始截图，请勿操作页面</li>
      <li>截图完成后会自动下载 PDF</li>
    </ol>
  </div>

  <button id="startBtn">开始截图</button>
  <button id="cancelBtn">取消截图</button>

  <div id="preview">
    <p style="color: #999; margin: 0;">点击按钮开始截图</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
